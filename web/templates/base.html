<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Locale — Free Bootstrap 6 Directory Website Template</title>
    <meta name="description"
          content="Locale is a free Bootstrap 6 directory and listings template — searchable filters, map rail, listing grid and a full detail page.">
    <!-- Bootstrap 6, bundled in assets/vendor/bootstrap6 (version in the JS bundle header). To load it from jsDelivr instead, replace both paths below with https://cdn.jsdelivr.net/npm/bootstrap@VERSION/dist/... -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/bootstrap6/css/bootstrap.min.css') }}">
    <script type="importmap">
        {
            "imports": {
                "bootstrap": "{{ url_for('static', filename='assets/vendor/bootstrap6/js/bootstrap.bundle.min.js') }}"
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
</head>
<body>
<a class="visually-hidden-focusable btn-solid theme-primary m-3" href="#results">Skip to results</a>

<header class="site-header">
    <nav class="navbar lg:navbar-expand" aria-label="Main">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3 fw-semibold" href="{{ url_for('main.home') }}">
                <span class="brand-mark" aria-hidden="true">L</span> Locale
            </a>
            <dialog class="drawer drawer-end" tabindex="-1" id="navDrawer" aria-labelledby="navDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-3 lg:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="#results">Browse</a></li>
                        <li class="nav-item">
                            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                                Categories
                                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="m3 6 5 5 5-5"/>
                                </svg>
                            </button>
                            <div class="menu">
                                <a class="menu-item" href="#results">Coffee &amp; bakeries</a>
                                <a class="menu-item" href="#results">Restaurants</a>
                                <a class="menu-item" href="#results">Bars</a>
                                <a class="menu-item" href="#results">Shops</a>
                                <hr class="menu-divider">
                                <a class="menu-item" href="#results">Services</a>
                            </div>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="#guides">Guides</a></li>
                    </ul>
                </div>
            </dialog>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <button class="btn-icon" type="button" id="themeToggle" aria-label="Toggle color mode">
                    <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 16 16" fill="none"
                         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                        <circle cx="8" cy="8" r="3.25"/>
                        <path d="M8 1v1.5M8 13.5V15M15 8h-1.5M2.5 8H1m11-4-1 1M5 11l-1 1m0-8 1 1m6 6 1 1"/>
                    </svg>
                    <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"
                         aria-hidden="true">
                        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
                    </svg>
                </button>
                <a class="btn-solid theme-primary d-none md:d-inline-flex" href="#">Add a listing</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                        data-bs-target="#navDrawer" aria-controls="navDrawer" aria-label="Open navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </nav>
</header>

{% block content %} {% endblock %}

<footer class="site-footer bg-2 py-7">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-4">
        <p class="fg-3 fs-xs mb-0">&copy; <span data-year>2026</span> Locale. A free template for uicookies.</p>
        <p class="fg-3 fs-xs mb-0">Built with Bootstrap 6.0.0-alpha1</p>
    </div>
</footer>

<script type="module" src="{{ url_for('static', filename='assets/js/main.js') }}"></script>
</body>
</html>
